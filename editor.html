<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 数据编辑器</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --danger: #f85149;
      --success: #3fb950;
      --warning: #d2991d;
      --row-hover: #1c2129;
      --cell-edit: #1f2a37;
      --cell-computed: #1a1e26;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    .header .sep {
      flex: 1;
    }

    /* ── toolbar ── */
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    select,
    button,
    input[type=text],
    input[type=file] {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s;
    }

    select:hover,
    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }

    button.primary:hover {
      background: #2ea043;
    }

    button.danger {
      background: #da3633;
      border-color: #da3633;
      color: #fff;
    }

    button.danger:hover {
      background: #f85149;
    }

    button:disabled {
      opacity: .4;
      pointer-events: none;
    }

    input[type=text] {
      cursor: text;
      min-width: 180px;
    }

    input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .file-label {
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px dashed var(--border);
      font-size: 13px;
      color: var(--text-muted);
      transition: border-color .15s;
    }

    .file-label:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .file-label input {
      display: none;
    }

    /* ── table area ── */
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 100px);
      margin: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }

    th {
      background: var(--surface);
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      transition: color .15s;
    }

    th:hover {
      color: var(--accent);
    }

    th .sort-arrow {
      margin-left: 4px;
      font-size: 11px;
      opacity: .5;
    }

    th.sort-asc .sort-arrow,
    th.sort-desc .sort-arrow {
      opacity: 1;
      color: var(--accent);
    }

    th.col-index {
      width: 48px;
      min-width: 48px;
      text-align: center;
      cursor: default;
      color: var(--text-muted);
    }

    th.col-computed {
      color: #5a6a7e;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      transition: background .1s;
    }

    tr:hover td {
      background: var(--row-hover);
    }

    /* editable cells */
    td.editable {
      cursor: text;
    }

    td.editable:focus-within {
      background: var(--cell-edit);
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    td.editable input {
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      width: 100%;
      padding: 0;
      outline: none;
    }

    td.editable input:focus {
      outline: none;
    }

    /* computed (read-only) cells */
    td.computed {
      cursor: default;
      color: #8b949e;
      font-style: italic;
    }

    td.computed:hover {
      background: var(--cell-computed);
    }

    /* modified marker */
    td.modified {
      position: relative;
    }

    td.modified::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warning);
    }

    td.col-index {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
    }

    /* ── delete button ── */
    .del-btn {
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
    }

    .del-btn:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    /* ── empty state ── */
    .empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 14px;
    }

    /* ── import modal ── */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 60;
    }

    .modal-mask[hidden] {
      display: none;
    }

    .modal {
      width: min(760px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .55);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-date {
      font-family: inherit;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: text;
      color-scheme: dark;
    }

    .modal-date:hover,
    .modal-date:focus {
      border-color: var(--border);
      background: var(--bg);
      outline: none;
    }

    .modal-caption {
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal-close {
      margin-left: auto;
      padding: 4px 10px;
      font-size: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
    }

    .modal-close:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .modal-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
    }

    .modal-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .modal textarea {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      outline: none;
    }

    .modal textarea:focus {
      border-color: var(--accent);
    }

    .import-status {
      min-height: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .import-status.ok {
      color: var(--success);
    }

    .import-status.error {
      color: var(--danger);
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }

    /* ── toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 100;
      animation: toastIn .25s ease;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(8px);
      }
    }

    /* ── stats bar ── */
    .stats {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 24px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stats .dirty {
      color: var(--warning);
    }

    .stats .computed-info {
      color: #5a6a7e;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📊 JSON 数据编辑器</h1>
    <div class="sep"></div>
    <div class="toolbar">
      <span class="file-label" id="openFileBtn" onclick="openLocalFile()" title="打开本地 JSON 文件">
        📂 打开 JSON
      </span>
      <input type="file" id="fileInput" accept=".json" onchange="loadFile(this)" style="display:none">
      <select id="presetSelect" onchange="loadPreset(this.value)" onfocus="initSGPresets()">
        <option value="">— 快速加载项目数据 —</option>
        <optgroup label="曙光英雄" id="sgOptgroup">
          <option value="">加载中...</option>
        </optgroup>
      </select>
      <button onclick="initSGPresets()" title="重新扫描根目录日期文件">🔄</button>
      <button onclick="openImportModal()" id="importBtn" title="粘贴周数据文本并解析导入">📥 文本导入</button>
      <a class="file-label" href="/blacklist.html" target="_blank" title="维护 UID 失信名单">🚫 失信名单</a>
      <button onclick="addRow()" disabled id="addBtn">＋ 添加行</button>
      <button class="primary" onclick="applyChanges()" disabled id="applyBtn" style="opacity:0.4">✏️ 应用修改</button>
      <button onclick="undoAll()" disabled id="undoBtn" class="danger" style="display:none">↩ 撤销全部修改</button>
    </div>
    <div class="toolbar">
      <button class="primary" onclick="saveJSON()" disabled id="saveBtn">💾 保存</button>
    </div>
  </div>

  <div class="stats" id="stats" style="display:none">
    <span id="statFile"></span>
    <span id="statRows"></span>
    <span id="statDirty" class="dirty"></span>
    <span id="statComputed" class="computed-info"></span>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="empty" id="empty">
      <div class="icon">📥</div>
      <p>打开 JSON 或使用「文本导入」开始编辑</p>
      <p style="font-size:12px;margin-top:4px;">可加载上方项目数据，或粘贴周数据文本（登场排名,英雄,胜率…）</p>
    </div>
    <table id="dataTable" style="display:none">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="modal-mask" id="importModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="文本导入">
      <div class="modal-head">
        <input type="date" id="importDate" class="modal-date" aria-label="数据日期" title="数据日期（可修改，保存为 曙光英雄_YYYY-MM-DD.json）" oninput="updateImportStatus()" onchange="updateImportStatus()">
        <span class="modal-caption">数据日期</span>
        <button class="modal-close" onclick="closeImportModal()" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-hint">
          粘贴周数据文本（CSV，6 列）：登场排名,英雄,胜率,击杀/死亡比,辅助数,场均经济。<br>
          当前表格已有数据时，按 <b>heroName</b> 匹配，只更新 <b>appearanceRank / winRate</b>，保留 power / players / 职业；没有数据时才新建表。
        </div>
        <textarea id="importText" spellcheck="false" aria-label="粘贴数据文本" placeholder="登场排名,英雄,胜率,击杀/死亡比,辅助数,场均经济&#10;1,艾璐妮,46.79%,0.73,15.02,12317&#10;2,貂蝉,51.87%,1.52,7.56,14027" oninput="updateImportStatus()"></textarea>
        <div class="import-status" id="importStatus"></div>
      </div>
      <div class="modal-foot">
        <button onclick="closeImportModal()">取消</button>
        <button class="primary" onclick="confirmImport()">保存</button>
      </div>
    </div>
  </div>

  <script src="js/dataSource.js"></script>
  <script>
    // ── state ──
    let data = null;           // parsed array of objects
    let columns = [];          // detected column keys
    let original = null;       // deep copy for undo
    let sortKey = null;
    let sortDir = 1;
    let currentFile = '';
    let currentBase = '';        // 非空表示数据来自项目根目录（可写回服务器）
    let currentFileHandle = null; // FileSystemFileHandle for direct write-back
    let computedFields = {};   // { fieldName: { dependsOn: [], compute: fn } }
    let sgConfig = null;       // 缓存的 config.json（日期列表 / 文件名）

    // ── computed field definitions ──
    // Add more definitions here when needed. The editor auto-detects which ones
    // apply based on whether all dependsOn columns exist in the loaded data.
    // 战力统一使用「国9战力」，不再维护派生的 combatPower 计算列。
    // 旧数据文件里的 combatPower / 国50战力 / 国100战力 保持原样（可查看、可手动编辑）。
    const COMPUTED_DEFS = {};
    // 编辑器不再展示旧「国9战力」列（数据仍保留在 JSON 中，保存时原样带回）
    const HIDDEN_COLUMNS = new Set(['国9战力']);

    // ── helpers ──
    function $(id) { return document.getElementById(id); }

    function toast(msg) {
      const el = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    function detectColumns(arr) {
      if (!arr || !arr.length) return [];
      const keys = new Set();
      arr.forEach(obj => Object.keys(obj).forEach(k => keys.add(k)));
      return Array.from(keys);
    }

    function normalizeValue(val) {
      if (val === null || val === undefined) return '';
      if (typeof val === 'object') return JSON.stringify(val);
      return String(val);
    }

    // Check which computed fields apply to the current data
    function resolveComputedFields() {
      computedFields = {};
      if (!data || !data.length) return;
      const cols = new Set(detectColumns(data));
      for (const [field, def] of Object.entries(COMPUTED_DEFS)) {
        if (cols.has(field) && def.dependsOn.every(d => cols.has(d))) {
          computedFields[field] = def;
        }
      }
    }

    // ── render ──
    function render() {
      resolveComputedFields();

      if (!data || !data.length) {
        $('dataTable').style.display = 'none';
        $('empty').style.display = '';
        $('stats').style.display = 'none';
        $('saveBtn').disabled = true;
        $('addBtn').disabled = true;
        $('applyBtn').disabled = true;
        $('applyBtn').style.opacity = '0.4';
        return;
      }

      $('empty').style.display = 'none';
      $('dataTable').style.display = '';
      $('saveBtn').disabled = false;
      $('addBtn').disabled = false;
      $('applyBtn').disabled = true;
      $('applyBtn').style.opacity = '0.4';
      $('stats').style.display = 'flex';

      columns = detectColumns(data).filter(col => !HIDDEN_COLUMNS.has(col));

      // sort
      let sorted = [...data];
      if (sortKey && columns.includes(sortKey)) {
        sorted.sort((a, b) => {
          let va = a[sortKey], vb = b[sortKey];
          let na = parseFloat(va), nb = parseFloat(vb);
          if (!isNaN(na) && !isNaN(nb)) return (na - nb) * sortDir;
          return String(va ?? '').localeCompare(String(vb ?? ''), 'zh-CN') * sortDir;
        });
      }

      // head
      let headHtml = '<tr><th class="col-index">#</th>';
      columns.forEach(col => {
        let cls = '';
        if (sortKey === col) cls = sortDir === 1 ? 'sort-asc' : 'sort-desc';
        if (computedFields[col]) cls += ' col-computed';
        const label = computedFields[col] ? col + ' 🔒' : col;
        headHtml += `<th class="${cls}" onclick="sortBy('${esc(col)}')">${label}<span class="sort-arrow">${sortKey === col ? (sortDir === 1 ? '▲' : '▼') : ''}</span></th>`;
      });
      headHtml += '<th class="col-index" style="cursor:default">✕</th></tr>';
      $('tableHead').innerHTML = headHtml;

      // body
      let bodyHtml = '';
      sorted.forEach((row, sortedIdx) => {
        const dataIdx = data.indexOf(row);
        bodyHtml += `<tr>`;
        bodyHtml += `<td class="col-index">${sortedIdx + 1}</td>`;
        columns.forEach(col => {
          if (computedFields[col]) {
            // ── computed cell (read-only) ──
            let val = normalizeValue(row[col]);
            bodyHtml += `<td class="computed">${val}</td>`;
          } else {
            // ── editable cell ──
            let val = normalizeValue(row[col]);
            // Compare only this cell's value, not the whole row
            let origVal = original && dataIdx >= 0 && dataIdx < original.length
              ? original[dataIdx][col] : undefined;
            let isMod = origVal !== undefined && String(row[col] ?? '') !== String(origVal ?? '');
            bodyHtml += `<td class="editable${isMod ? ' modified' : ''}">`
              + `<input value="${val.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}"`
              + ` data-col="${esc(col)}" data-sorted-idx="${sortedIdx}" data-original="${esc(val)}"`
              + ` oninput="markDirty(this)" onfocus="this.select()">`
              + `</td>`;
          }
        });
        bodyHtml += `<td><button class="del-btn" onclick="deleteRow(${sortedIdx})" title="删除此行">✕</button></td>`;
        bodyHtml += `</tr>`;
      });
      $('tableBody').innerHTML = bodyHtml;

      // stats
      $('statFile').textContent = '📄 ' + (currentFile || '未命名数据');
      $('statRows').textContent = `📋 ${data.length} 行 × ${columns.length} 列`;
      $('statDirty').textContent = '💡 编辑后点击「💾 保存」写回文件';

      // Undo button: show if original snapshot exists
      if (original) {
        $('undoBtn').style.display = '';
        $('undoBtn').disabled = false;
      } else {
        $('undoBtn').style.display = 'none';
      }

      let compKeys = Object.keys(computedFields);
      $('statComputed').textContent = compKeys.length ? `🔒 自动计算: ${compKeys.join(', ')}` : '';
    }

    function esc(s) {
      return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ── edit helpers ──
    function startEdit(td) {
      const input = td.querySelector('input');
      if (!input || document.activeElement === input) return;
      input.focus();
    }

    // Mark an input (and its td) as dirty when the user types
    function markDirty(input) {
      const td = input.closest('td');
      if (td) td.classList.add('modified');
      updateSaveState();
    }

    // Check if any input differs from its data-original value
    function hasUnsavedChanges() {
      const inputs = $('tableBody').querySelectorAll('input');
      for (const inp of inputs) {
        if (inp.dataset.col && inp.value.trim() !== (inp.dataset.original || '')) return true;
      }
      return false;
    }

    // Enable/disable save-related UI based on dirty state
    function updateSaveState() {
      const dirty = hasUnsavedChanges();
      console.log('[SAVE-STATE] dirty:', dirty, 'applyBtn disabled:', !dirty);
      $('applyBtn').disabled = !dirty;
      $('applyBtn').style.opacity = dirty ? '1' : '0.4';
    }

    // Read all inputs from DOM, write to data, recalc, re-render
    // silent=true: 只把输入写回 data，不重绘/不提示（供保存前调用）
    function applyChanges(silent = false) {
      if (!data) return 0;
      const inputs = $('tableBody').querySelectorAll('input');
      let changed = 0;

      if (!original) original = JSON.parse(JSON.stringify(data));

      const sorted = getSortedData();

      inputs.forEach(input => {
        const col = input.dataset.col;
        const sortedIdx = parseInt(input.dataset.sortedIdx);
        const newVal = input.value.trim();
        const oldVal = (input.dataset.original || '').trim();

        if (!col || newVal === oldVal) return;

        // auto-detect number
        let val = newVal;
        if (val !== '' && !isNaN(val) && !/^0\d/.test(val)) val = Number(val);

        // Map sortedIdx → data[]
        if (sortedIdx >= 0 && sortedIdx < sorted.length) {
          const row = sorted[sortedIdx];
          const dataIdx = data.indexOf(row);
          if (dataIdx >= 0) {
            data[dataIdx][col] = val;
            recalcRow(data[dataIdx]);
            changed++;
          }
        }
      });

      if (changed > 0) {
        recalcAll(); // ensure cross-row computed consistency
        if (!silent) {
          render();
          toast(`已应用 ${changed} 个修改`);
        }
      } else if (!silent) {
        toast('没有需要保存的修改');
      }
      return changed;
    }

    // Recalculate all computed fields for a single row
    function recalcRow(row) {
      for (const [field, def] of Object.entries(computedFields)) {
        row[field] = def.compute(row);
      }
    }

    // Recalculate all computed fields for all rows (e.g. after initial load)
    function recalcAll() {
      if (!data) return;
      resolveComputedFields();
      data.forEach(row => recalcRow(row));
    }

    // ── sort ──
    function getSortedData() {
      if (!data) return [];
      let sorted = [...data];
      if (sortKey && columns.includes(sortKey)) {
        sorted.sort((a, b) => {
          let va = a[sortKey], vb = b[sortKey];
          let na = parseFloat(va), nb = parseFloat(vb);
          if (!isNaN(na) && !isNaN(nb)) return (na - nb) * sortDir;
          return String(va ?? '').localeCompare(String(vb ?? ''), 'zh-CN') * sortDir;
        });
      }
      return sorted;
    }

    function sortBy(col) {
      if (hasUnsavedChanges()) {
        if (!confirm('有未保存的修改，排序会导致编辑内容丢失。确定继续排序？')) return;
      }
      if (sortKey === col) {
        sortDir *= -1;
      } else {
        sortKey = col;
        sortDir = 1;
      }
      render();
    }

    // ── row operations ──
    function addRow() {
      if (!data) return;
      if (hasUnsavedChanges()) {
        if (!confirm('有未保存的修改，添加行会导致编辑内容丢失。确定继续？')) return;
      }
      if (!original) original = JSON.parse(JSON.stringify(data));
      const newRow = {};
      columns.forEach(col => {
        // computed fields start empty — will be recalc'd
        newRow[col] = computedFields[col] ? 0 : '';
      });
      data.push(newRow);
      recalcRow(newRow);
      render();
      $('tableWrap').scrollTop = $('tableWrap').scrollHeight;
      toast('已添加新行');
    }

    function deleteRow(sortedIdx) {
      const sorted = getSortedData();
      const row = sorted[sortedIdx];
      const dataIdx = data.indexOf(row);
      if (dataIdx < 0) return;
      if (!original) original = JSON.parse(JSON.stringify(data));
      const nameCol = columns.find(c => c.toLowerCase().includes('name') || c === 'heroName') || columns[0];
      const name = row[nameCol] || `第${dataIdx + 1}行`;
      if (!confirm(`确定要删除 "${name}" 吗？`)) return;
      data.splice(dataIdx, 1);
      render();
      toast(`已删除: ${name}`);
    }

    // ── undo ──
    function undoAll() {
      // DOM-only 修改（如 Ctrl+V 粘贴但未应用）：直接重新渲染即可清除
      if (!original) {
        if (!hasUnsavedChanges()) {
          toast('没有需要撤销的修改');
          return;
        }
        if (!confirm('确定撤销所有未保存的编辑吗？此操作不可撤销。')) return;
        render();
        toast('已撤销所有编辑');
        return;
      }
      // 数据级修改（已应用）：从快照恢复
      if (!confirm('确定撤销所有修改，恢复到加载时的原始数据吗？此操作不可撤销。')) return;
      data = JSON.parse(JSON.stringify(original));
      original = null;
      sortKey = null;
      sortDir = 1;
      recalcAll();
      render();
      toast('已恢复到原始数据');
    }

    // ── load JSON ──
    function setData(arr, filename, opts = {}) {
      if (!Array.isArray(arr)) {
        const found = Object.values(arr).find(v => Array.isArray(v));
        if (found) arr = found;
        else {
          alert('JSON 文件格式不正确：需要包含一个数组，或包含数组的对象。');
          return;
        }
      }
      data = arr.map(row => {
        const clone = {};
        Object.keys(row).forEach(k => { clone[k] = row[k]; });
        return clone;
      });
      original = null;
      sortKey = null;
      sortDir = 1;
      currentFile = filename || '';
      currentFileHandle = null; // clear — only openLocalFile() sets this

      // Apply computed field formulas to ensure consistency on load
      recalcAll();

      render();
      if (!opts.silent) toast(`已加载: ${filename || '数据'} (${data.length} 行)`);
    }

    // ── Open local file with File System Access API (direct write-back) ──
    async function openLocalFile() {
      if ('showOpenFilePicker' in window) {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'JSON files', accept: { 'application/json': ['.json'] } }],
            multiple: false
          });
          const file = await handle.getFile();
          const text = await file.text();
          const parsed = JSON.parse(text);
          currentBase = ''; // FS Access 打开的文件走文件句柄保存，不走服务器路径
          setData(parsed, file.name);
          currentFileHandle = handle;
          toast(`已打开: ${file.name}（保存时将直接写回原文件）`);
        } catch (e) {
          if (e.name !== 'AbortError') alert('打开文件失败: ' + e.message);
        }
      } else {
        // Fallback for browsers without File System Access API
        $('fileInput').click();
      }
    }

    function loadFile(input) {
      const file = input.files[0];
      if (!file) return;
      currentBase = '';        // 本地文件不知归属目录，服务器保存不可用
      currentFile = file.name;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          setData(parsed, file.name);
        } catch (e) {
          alert('JSON 解析失败: ' + e.message);
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    function loadPreset(path) {
      if (!path) return;
      $('presetSelect').value = '';
      fetch(path)
        .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
        .then(json => {
          // 单游戏：预设都是项目根目录下的文件，标记为可写回服务器
          currentBase = 'root';
          currentFile = path;
          setData(json, currentFile);
        })
        .catch(err => alert('加载失败: ' + err.message));
    }

    // ── save ──
    // 保存前先把表格里尚未「应用」的输入写回 data，避免填写国9战力后直接保存丢失。
    async function saveJSON() {
      if (!data) return;

      applyChanges(true);
      recalcAll();

      // 项目根目录数据：走 bun 服务器原子写回
      if (currentBase) {
        const saved = await DataSource.saveToDisk(currentFile, data);
        if (saved && saved.ok) {
          toast(`✅ 已保存到 ${currentFile}（${saved.rows} 行）`);
          original = null;
          render();
          sgConfig = null;
          initSGPresets();
          return;
        }
        alert(saved
          ? '写回项目文件失败: ' + (saved.error || '未知错误')
          : '服务器不可用，无法写回项目文件。请用 bun server.js 启动后访问本页。');
        return;
      }

      // 通过 File System Access 打开的本地文件：直接写回原文件
      if (currentFileHandle) {
        try {
          const json = JSON.stringify(data, null, 2);
          const writable = await currentFileHandle.createWritable();
          await writable.write(json);
          await writable.close();
          toast(`已保存到 ${currentFile || '文件'}`);
          original = null;
          render();
        } catch (e) {
          alert('直接保存失败: ' + e.message);
        }
        return;
      }

      alert('当前数据来自本地文件，浏览器无法直接写回。请通过「快速加载项目数据」或「文本导入」后保存。');
    }

    // ============================================================
    // 文本导入：把周数据 CSV 粘贴文本解析为当前数据表
    // 源格式：登场排名,英雄,胜率,击杀/死亡比,辅助数,场均经济
    // 只取前三列；职业从上一期继承；国9战力留空待填。
    // ============================================================
    // 默认数据日期 = 本周周一（与现有数据文件的「起始日期」习惯一致）
    function defaultImportDate() {
      const d = new Date();
      const offset = (d.getDay() + 6) % 7; // 周一=0
      d.setDate(d.getDate() - offset);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function importFileName(dateStr) {
      return '曙光英雄_' + dateStr + '.json';
    }

    function openImportModal() {
      const modal = $('importModal');
      if (!modal) return;
      if (!$('importDate').value) {
        const m = String(currentFile || '').match(/(\d{4}-\d{2}-\d{2})/);
        $('importDate').value = m ? m[1] : defaultImportDate();
      }
      modal.hidden = false;
      updateImportStatus();
      $('importText').focus();
    }

    function closeImportModal() {
      const modal = $('importModal');
      if (modal) modal.hidden = true;
    }

    // 解析粘贴文本 → { rows, errors }
    function parseImportText(text) {
      const rows = [];
      const errors = [];
      const lines = String(text || '')
        .replace(/^\uFEFF/, '')
        .replace(/\r\n?/g, '\n')
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean);

      for (const line of lines) {
        const cells = line.split(/[,\t，]/).map(s => s.trim().replace(/^"(.*)"$/, '$1').trim());
        if (!/^\d+$/.test(cells[0] || '')) {
          // 表头或无法解析的行（表头只出现在正式数据前）
          if (rows.length === 0 && /登场排名|排名|英雄|胜率/.test(line)) continue;
          errors.push(line);
          continue;
        }
        const rank = parseInt(cells[0], 10);
        const hero = cells[1] || '';
        const wrRaw = String(cells[2] || '').replace('%', '').trim();
        let wr = parseFloat(wrRaw);
        if (!hero || !Number.isFinite(rank) || !Number.isFinite(wr)) {
          errors.push(line);
          continue;
        }
        // 兼容不带 % 的小数胜率（0.4679 → 46.79）
        if (!String(cells[2]).includes('%') && wr > 0 && wr <= 1) wr *= 100;
        rows.push({
          heroName: hero,
          职业: '',
          appearanceRank: rank,
          国9战力: '',
          winRate: wr.toFixed(2) + '%'
        });
      }

      rows.sort((a, b) => a.appearanceRank - b.appearanceRank);
      return { rows, errors };
    }

    function updateImportStatus() {
      const el = $('importStatus');
      if (!el) return;
      const text = $('importText').value;
      const dateStr = $('importDate').value;
      if (!text.trim()) {
        el.textContent = dateStr ? `将写入 ${importFileName(dateStr)}` : '';
        el.className = 'import-status';
        return;
      }
      const { rows, errors } = parseImportText(text);
      const parts = [`识别 ${rows.length} 行`];
      if (errors.length) parts.push(`${errors.length} 行无法解析`);
      if (Array.isArray(data) && data.length) parts.push('按 heroName 更新当前表');
      else if (dateStr) parts.push(`将写入 ${importFileName(dateStr)}`);
      el.textContent = parts.join(' · ');
      el.className = 'import-status ' + (errors.length ? 'error' : (rows.length ? 'ok' : ''));
    }

    // 取「上一期」数据，返回 { map: 英雄→职业, prevDate }
    async function loadProfessionsFor(dateStr, cfg) {
      cfg = cfg || sgConfig || await DataSource.loadConfig();
      const dates = (cfg && Array.isArray(cfg.dates)) ? cfg.dates.slice() : [];
      const prev = dates.map(d => d.date).filter(d => d < dateStr).sort().pop();
      if (!prev) return { map: {}, prevDate: null };
      const entry = dates.find(d => d.date === prev);
      if (!entry) return { map: {}, prevDate: null };
      const resp = await fetch(entry.file);
      if (!resp.ok) throw new Error(`${entry.file} 请求失败: ${resp.status}`);
      const arr = await resp.json();
      const map = {};
      (Array.isArray(arr) ? arr : []).forEach(h => {
        if (h && typeof h === 'object' && typeof h.heroName === 'string') {
          map[h.heroName] = h['职业'] || '';
        }
      });
      return { map, prevDate: prev };
    }

    // 文本导入 → 按 heroName 合并到当前表：只更新 appearanceRank / winRate，
    // 保留 power / players / 职业 等分布字段。
    function mergeImportRows(imported, professionMap = {}) {
      const current = Array.isArray(data) ? data : [];
      const merged = current.map(row => ({ ...row }));
      const byName = new Map();
      merged.forEach(row => {
        const name = String(row.heroName ?? row.name ?? '').trim();
        if (name) byName.set(name, row);
      });

      let updated = 0, added = 0;
      const seen = new Set();
      for (const src of imported) {
        const name = String(src.heroName || '').trim();
        if (!name) continue;
        const target = byName.get(name);
        if (target) {
          target.appearanceRank = src.appearanceRank;
          target.winRate = src.winRate;
          if (!target['职业'] && professionMap[name]) target['职业'] = professionMap[name];
          if (!seen.has(name)) { updated++; seen.add(name); }
        } else {
          const row = { ...src };
          if (professionMap[name]) row['职业'] = professionMap[name];
          merged.push(row);
          byName.set(name, row);
          added++;
        }
      }
      return { merged, updated, added, untouched: current.length - seen.size };
    }

    async function confirmImport() {
      const dateStr = $('importDate').value;
      if (!dateStr) {
        alert('请填写数据日期。');
        return;
      }
      const { rows, errors } = parseImportText($('importText').value);
      if (!rows.length) {
        alert('未解析到有效数据。\n请按「登场排名,英雄,胜率,击杀/死亡比,辅助数,场均经济」格式粘贴。');
        return;
      }
      if (errors.length && !confirm(`有 ${errors.length} 行无法解析，将忽略这些行。继续？`)) return;

      const hasCurrent = Array.isArray(data) && data.length > 0;
      const currentDate = (String(currentFile || '').match(/(\d{4}-\d{2}-\d{2})/) || [])[1] || null;
      if (hasCurrent && currentDate && dateStr && currentDate !== dateStr) {
        if (!confirm(`当前表格是 ${currentDate}，导入日期是 ${dateStr}。\n仍按英雄名更新当前表格（不切换文件）？`)) return;
      }
      if (hasCurrent && hasUnsavedChanges() && !confirm('当前表格有未保存修改，导入会覆盖 appearanceRank / winRate。继续？')) return;

      let cfg = sgConfig;
      if (!cfg) {
        try { cfg = await DataSource.loadConfig(); sgConfig = cfg; } catch (e) { /* 无服务器时仍允许导入 */ }
      }

      let prof = { map: {}, prevDate: null };
      try {
        prof = await loadProfessionsFor(dateStr, cfg);
      } catch (e) {
        console.warn('[import] 读取上一期职业失败:', e);
      }
      rows.forEach(r => {
        const profession = prof.map[r.heroName];
        if (profession) r['职业'] = profession;
      });

      // 已有表格：按英雄名合并统计列，保留分布
      if (hasCurrent) {
        const { merged, updated, added, untouched } = mergeImportRows(rows, prof.map);
        if (!updated && !added) {
          alert('文本中的英雄名和当前表格没有匹配项，未做修改。');
          return;
        }
        setData(merged, currentFile || importFileName(dateStr), { silent: true });
        closeImportModal();
        $('importText').value = '';
        updateImportStatus();
        const msg = [
          `已按英雄名更新 ${updated} 行`,
          added ? `新增 ${added} 行` : '',
          '保留 power / players / 职业',
          untouched ? `${untouched} 行未在文本中，保持原值` : ''
        ].filter(Boolean);
        toast(msg.join('；'));
        return;
      }

      // 空表格：创建新表
      if (cfg && Array.isArray(cfg.dates) && cfg.dates.some(d => d.date === dateStr)) {
        if (!confirm(`${dateStr} 已存在数据文件，导入后保存会覆盖原文件。继续？`)) return;
      }
      currentBase = 'root';
      currentFile = importFileName(dateStr);
      setData(rows, currentFile, { silent: true });
      closeImportModal();
      $('importText').value = '';
      updateImportStatus();

      let missing = 0;
      rows.forEach(r => { if (!r['职业']) missing++; });
      const parts = [`已导入 ${rows.length} 行到编辑器`];
      if (prof.prevDate) parts.push(`职业取自 ${prof.prevDate}`);
      if (missing) parts.push(`${missing} 位英雄未匹配到职业`);
      parts.push('点击「💾 保存」写入文件');
      toast(parts.join('；'));
    }

    // ── import modal: Esc / 点击遮罩关闭 ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('importModal').hidden) closeImportModal();
    });
    $('importModal').addEventListener('click', e => {
      if (e.target === $('importModal')) closeImportModal();
    });

    // ── keyboard shortcuts ──
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveJSON();      // 保存前会先应用表格输入
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        applyChanges();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        undoAll();
      }
    });

    // ── drag & drop ──
    document.body.addEventListener('dragover', e => { e.preventDefault(); });
    document.body.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.json')) {
        currentBase = '';       // 拖入的本地文件不归属项目目录
        currentFile = file.name;
        const reader = new FileReader();
        reader.onload = () => {
          try { setData(JSON.parse(reader.result), file.name); }
          catch (err) { alert('JSON 解析失败: ' + err.message); }
        };
        reader.readAsText(file);
      }
    });

    // ── click on editable td → focus its input ──
    document.addEventListener('click', e => {
      const td = e.target.closest('td.editable');
      if (td) startEdit(td);
    });

    // ── Tab navigation: Tab/Shift+Tab moves between editable cells ──
    $('tableBody').addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        const input = document.activeElement;
        if (!input || input.tagName !== 'INPUT' || !input.dataset.col) return;
        e.preventDefault();

        const td = input.closest('td');
        const allCells = [...$('tableBody').querySelectorAll('td.editable')];
        const idx = allCells.indexOf(td);
        const nextIdx = e.shiftKey ? idx - 1 : idx + 1;

        if (nextIdx >= 0 && nextIdx < allCells.length) {
          startEdit(allCells[nextIdx]);
        }
      }

      // Enter → move to same column, next row
      if (e.key === 'Enter' && !e.shiftKey) {
        const input = document.activeElement;
        if (!input || input.tagName !== 'INPUT' || !input.dataset.col) return;
        e.preventDefault();

        const col = input.dataset.col;
        const sortedIdx = parseInt(input.dataset.sortedIdx);

        const allInputs = [...$('tableBody').querySelectorAll('input')];
        const next = allInputs.find(inp =>
          inp.dataset.col === col && parseInt(inp.dataset.sortedIdx) === sortedIdx + 1
        );
        if (next) { next.focus(); next.select(); }
      }
    });

    // ── Paste handler: writes directly to DOM inputs, no data-model changes ──
    console.log('%c[INIT] %cPaste listener attached to document', 'color:#3fb950;font-weight:bold', '');
    document.addEventListener('paste', function (e) {
      // Find the editable input — either the event target itself or the activeElement
      let input = null;
      if (e.target.tagName === 'INPUT' && e.target.dataset.col) {
        input = e.target;
      } else if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.dataset.col) {
        input = document.activeElement;
      }

      console.log('[PASTE] target input:', input ? `col=${input.dataset.col}, sortedIdx=${input.dataset.sortedIdx}` : 'NOT FOUND');
      if (!input) return; // not pasting into our editable cell

      const pasteText = (e.clipboardData || window.clipboardData).getData('text');
      console.log('[PASTE] raw text length:', pasteText ? pasteText.length : 0, 'first 100 chars:', JSON.stringify(pasteText ? pasteText.substring(0, 100) : ''));
      if (!pasteText) return;

      // Normalize line endings and split
      const rawLines = pasteText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

      // Remove trailing empty lines
      while (rawLines.length && rawLines[rawLines.length - 1].trim() === '') rawLines.pop();

      console.log('[PASTE] line count:', rawLines.length, 'lines:', JSON.stringify(rawLines.slice(0, 5)));
      // If only one line, let the default paste behavior handle it (single value)
      if (rawLines.length <= 1) {
        console.log('[PASTE] single line, letting default paste handle it (oninput will fire markDirty)');
        return;
      }

      // ── Multi-value paste: fill DOM inputs in the same column downward ──
      e.preventDefault();

      // Create undo snapshot before modifying DOM, so the user can revert
      if (!original) {
        original = JSON.parse(JSON.stringify(data));
        // Show undo button immediately — can't call render() because it would
        // rebuild the table and wipe the DOM values we're about to fill.
        $('undoBtn').style.display = '';
        $('undoBtn').disabled = false;
      }

      const col = input.dataset.col;
      const sortedIdx = parseInt(input.dataset.sortedIdx);
      const colInputs = [...$('tableBody').querySelectorAll('input[data-col="' + esc(col) + '"]')]
        .sort((a, b) => parseInt(a.dataset.sortedIdx) - parseInt(b.dataset.sortedIdx));

      let filled = 0;
      for (let i = 0; i < rawLines.length; i++) {
        const val = rawLines[i].trim();
        if (val === '') continue;
        const target = colInputs[sortedIdx + i];
        if (!target) break; // no more rows in this column
        target.value = val;
        // 不修改 dataset.original，保留渲染时设置的原始值，
        // 这样 hasUnsavedChanges() 和 applyChanges() 才能正确检测到粘贴带来的修改
        filled++;
      }

      // Mark all filled cells as needing save (they differ from original data)
      for (let i = 0; i < filled; i++) {
        const target = colInputs[sortedIdx + i];
        if (target) {
          const td = target.closest('td');
          if (td) td.classList.add('modified');
        }
      }

      updateSaveState();
      console.log('[PASTE] filled:', filled, 'values into column:', col);
      toast(`已填入 ${filled} 个值到 "${col}" 列，点击「✏️ 应用修改」保存`);
    });

    // ── 动态加载曙光英雄日期预设 ──
    // 排行页日期来自 SQLite；编辑器「快速加载」需要直接扫根目录日期文件，
    // 否则新丢进来的 曙光英雄_YYYY-MM-DD.json 不会出现。
    async function initSGPresets() {
      const optgroup = document.getElementById('sgOptgroup');
      if (!optgroup) return;
      try {
        const config = await DataSource.loadConfig();
        const list = await DataSource.listFiles().catch(() => null);
        const map = new Map();
        (config.dates || []).forEach(d => {
          if (d && d.date) map.set(d.date, { date: d.date, file: d.file });
        });
        ((list && list.files) || []).forEach(file => {
          const m = /_(\d{4}-\d{2}-\d{2})\.json$/.exec(file);
          if (m) map.set(m[1], { date: m[1], file });
        });

        optgroup.innerHTML = '';
        const gameName = config.gameName || '曙光英雄';
        const sorted = [...map.values()].sort((a, b) => b.date.localeCompare(a.date));
        config.dates = sorted;
        sgConfig = config;
        if (sorted.length) {
          sorted.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.file;
            opt.textContent = gameName + ' ' + d.date;
            optgroup.appendChild(opt);
          });
        } else if (config.hasDates) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.disabled = true;
          opt.textContent = gameName + '（未发现日期文件：请用 bun server.js 启动）';
          optgroup.appendChild(opt);
        } else if (config.dataFile) {
          const opt = document.createElement('option');
          opt.value = config.dataFile;
          opt.textContent = gameName;
          optgroup.appendChild(opt);
        }
      } catch (e) {
        optgroup.innerHTML = '<option value="" disabled>曙光英雄（配置加载失败，请用 bun server.js 启动）</option>';
        console.warn('Failed to load SG config for presets, using fallback:', e);
      }
    }
    document.addEventListener('DOMContentLoaded', initSGPresets);

  </script>
</body>

</html>
